name: Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  ios:
    name: ios (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prebuilt React Native
            from-source: false
          - name: React Native from source
            from-source: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:package -- ios 5.1.0 --prepare-in "$RUNNER_TEMP/test-library"
      - uses: ./ios
        with:
          working-directory: ${{ runner.temp }}/test-library
          from-source: ${{ matrix.from-source }}

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:package -- android 5.0.4 --prepare-in "$RUNNER_TEMP/test-library"
      - uses: ./android
        with:
          working-directory: ${{ runner.temp }}/test-library
