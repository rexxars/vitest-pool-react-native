name: Run Vitest on iOS
description: Build or restore the plain React Native simulator app and run a Vitest project on macOS.
inputs:
  project:
    description: Name of the iOS project in your Vitest config.
    default: ios
  config:
    description: Vitest config file to use, relative to the working directory. Leave empty for Vitest's default lookup.
    default: ''
  working-directory:
    description: Library directory containing the installed pool and Vitest config.
    default: .
  from-source:
    description: Compile React Native from source instead of using its prebuilt iOS binaries. Slower, only needed for native changes to React Native itself.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Identify the iOS host and simulator
      id: host
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VITEST_IOS_FROM_SOURCE: ${{ inputs.from-source == 'true' && '1' || '0' }}
      run: node "$GITHUB_ACTION_PATH/host-cache.mjs"
    - name: Cache the simulator app
      id: app
      uses: actions/cache@v6
      with:
        path: ${{ steps.host.outputs.app }}
        key: ${{ steps.host.outputs.key }}
    - name: Set up Ruby and Bundler
      if: steps.app.outputs.cache-hit != 'true'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler: '4.0.23'
    - name: Build and install the simulator app
      if: steps.app.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VITEST_IOS_DEVICE: ${{ steps.host.outputs.udid }}
        FROM_SOURCE: ${{ inputs.from-source }}
      run: |
        if [ "$FROM_SOURCE" = true ]; then
          npm exec --no -- vitest-pool-react-native setup ios --from-source
        else
          npm exec --no -- vitest-pool-react-native setup ios
        fi
    - name: Install the cached simulator app
      if: steps.app.outputs.cache-hit == 'true'
      shell: bash
      env:
        SIMULATOR: ${{ steps.host.outputs.udid }}
        APP: ${{ steps.host.outputs.app }}
      run: |
        xcrun simctl bootstatus "$SIMULATOR" -b
        xcrun simctl install "$SIMULATOR" "$APP"
    - name: Run the iOS project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VITEST_IOS_DEVICE: ${{ steps.host.outputs.udid }}
        VITEST_PROJECT: ${{ inputs.project }}
        VITEST_CONFIG: ${{ inputs.config }}
        VITEST_IOS_RECOVER_STARTUP: '1'
      run: npm exec --no -- vitest run ${VITEST_CONFIG:+--config "$VITEST_CONFIG"} --project "$VITEST_PROJECT"
